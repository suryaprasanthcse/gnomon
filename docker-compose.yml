# FalkorDB only, pinned by digest at A01 (gate G0); see .agent/FACTS.md.
# AOF with appendfsync always: a commit is acknowledged only once fsynced (master §25.2).
# The host port is GNOMON_PORT (default 6379); the demo scripts and the clean-install test read GNOMON_FALKORDB_URL.
services:
  falkordb:
    image: falkordb/falkordb@sha256:bef8acb1d8ed9ff8d2ea251767e75c6c05cfa759f7c6bc7e1c122f27d0ea4d7f
    ports:
      - "${GNOMON_PORT:-6379}:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync always"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  falkordb-data:
