# Lint fixture (LintL2Fail). Never registered; used only by tests/unit/footprint/test_lints.py.
name: LintL2Fail
version: 1
class: memory
layer: core
caller: [triage]
prelude: P0
reads: [Task, Task.id, Task.state]
writes: [Task.claimed_at, Task.state]
key_templates: ["Task:{p.task}:state"]
body: |
  MATCH (t:Task {id: $p.task})
  WHERE t.state = 'open'
  WITH KCTX, t
  SET t.state = 'claimed', t.claimed_at = timestamp()
  WITH KCTX
