# Lint fixture (LintL1Fail). Never registered; used only by tests/unit/footprint/test_lints.py.
name: LintL1Fail
version: 1
class: memory
layer: core
caller: [triage]
prelude: P0
reads: [Task, Task.id]
writes: [Task.state]
key_templates: ["Task:{p.task}:state"]
body: |
  MATCH (t:Task {id: $p.task})
  WITH KCTX, t
  SET t.state = 'claimed'
  WITH KCTX
