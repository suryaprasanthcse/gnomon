# Lint fixture (LintL3Fail). Never registered; used only by tests/unit/footprint/test_lints.py.
name: LintL3Fail
version: 1
class: memory
layer: core
caller: [triage]
prelude: P0
reads: [Task, Task.state]
writes: [Task.state]
key_templates: ["Task:{p.task}:state"]
body: |
  MATCH (t:Task)
  WHERE t.state = 'open'
  WITH KCTX, t
  SET t.state = 'claimed'
  WITH KCTX
