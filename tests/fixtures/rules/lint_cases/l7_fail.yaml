# Lint fixture (LintL7Fail). Never registered; used only by tests/unit/footprint/test_lints.py.
name: LintL7Fail
version: 1
class: memory
layer: core
caller: [triage]
prelude: P0
reads: [Task, Task.claims, Task.id, Task.state]
writes: [Task.claims, Task.state]
key_templates: ["Task:{p.task}:state"]
body: |
  MATCH (t:Task {id: $p.task})
  WHERE t.state = 'open'
  WITH KCTX, t
  SET t.state = 'claimed', t.claims = t.claims + 1
  WITH KCTX
