# Lint fixture (LintL5Fail). Never registered; used only by tests/unit/footprint/test_lints.py.
name: LintL5Fail
version: 1
class: memory
layer: core
caller: [triage]
prelude: P0
reads: [Task, Task.id, Task.state]
writes: [Task.state]
key_templates: ["Task:{agent}:state"]
body: |
  MATCH (t:Task {id: $p.task})
  WHERE t.state = 'open'
  WITH KCTX, t
  SET t.state = 'claimed'
  WITH KCTX
