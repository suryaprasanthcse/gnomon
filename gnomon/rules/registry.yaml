# GNOMON rule registry (master §3.3, §5.1, §5.2, §9). Everything here is registered at genesis.
# `rules` are single definitions; `families` are templates whose members are expanded (placeholders
# substituted, macros expanded) and hashed as ordinary rules. A rule's sha is SHA-256(JCS(def_json)).
#
# Guard probes are read-only queries, one per guard, run in order by diagnosis D8. A probe that needs
# the apply query's `now` recomputes it from Head the way the tick does (wall in live mode, $rec_pt
# otherwise); the probe text <NOW> is substituted when the registry loads.

probe_macros:
  <NOW>: "CASE WHEN $mode = 'live' THEN (CASE WHEN timestamp() > h.pt THEN timestamp() ELSE h.pt END) ELSE $rec_pt END"

# §3.3 fact types (DECISIONS D-13): recorded by R0 as FactType nodes.
fact_types:
  - {rel: OWNED_BY, s_labels: [Service], o_labels: [Team], cardinality: functional, projection: OWNER_NOW, attrs: []}
  - {rel: DEPENDS_ON, s_labels: [Service], o_labels: [Service, ExternalService], cardinality: set, projection: DEP_NOW, attrs: [hard]}
  - {rel: DEPLOYED, s_labels: [Service], o_labels: [Deploy], cardinality: functional, projection: null, attrs: []}
  - {rel: REPLICA_OF, s_labels: [Service], o_labels: [Service], cardinality: functional, projection: null, attrs: []}
  - {rel: MEMBER_OF, s_labels: [Agent], o_labels: [Team], cardinality: set, projection: null, attrs: []}
  - {rel: ROOT_CAUSE, s_labels: [Incident], o_labels: [Deploy, Service], cardinality: set, projection: null, attrs: [by, confidence]}
  - {rel: CONSUMES, s_labels: [Consumer], o_labels: [Service], cardinality: set, projection: CONSUMES_NOW, attrs: [hard]}

rules:
  - name: Genesis
    version: 1
    class: kernel
    layer: core
    family: null
    caller: [kernel]
    prelude: PG
    requires_decision: false
    gated: false
    evidence: false
    reads: []
    writes: [Rule, FactType, Skill, Agent, HAS_SKILL, IndexEntry, ConstraintEntry]
    key_templates: ["Head", "Rule:*", "Rule:{p.rules[].name}", "Agent:*", "Skill:*", "FactType:*", "Index:*"]
    view_templates: []
    # The PG checks, in PG order, as read-only probes (diagnosis D8 names the first that fails).
    guard_probes:
      - name: no_head
        cypher: "OPTIONAL MATCH (h:Head) WITH count(h) AS heads WHERE heads = 0 RETURN heads"
      - name: genesis_rule_pinned
        cypher: "WITH $rule AS rule WHERE rule = 'Genesis' AND any(r IN $p.rules WHERE r.name = 'Genesis' AND r.sha = $rule_sha) RETURN rule"
      - name: kernel_sha_matches
        cypher: "WITH $p.kernel_src AS src WHERE CASE WHEN src IS NULL THEN false ELSE Kernel.sha256(src) = $p.kernel_sha END RETURN size(src)"
      - name: has_agents
        cypher: "WITH $p.agents AS agents WHERE size(agents) >= 1 RETURN size(agents)"
      - name: kernel_agent
        cypher: "WITH $p.agents AS agents WHERE any(a IN agents WHERE a.role = 'kernel') RETURN size(agents)"
      - name: agent_skills_known
        cypher: "WITH $p.agents AS agents WHERE all(a IN agents WHERE all(s IN a.skills WHERE s IN $p.skills)) RETURN size(agents)"
      - name: rule_shas_match
        cypher: "WITH $p.rules AS rules WHERE all(r IN rules WHERE CASE WHEN r.def_json IS NULL THEN false ELSE Kernel.sha256(r.def_json) = r.sha END) RETURN size(rules)"
    body_file: core/genesis.cypher

  - name: RegisterRule
    version: 1
    class: meta
    layer: core
    caller: [operator]
    prelude: P0
    reads: [Rule]
    writes: [Rule]
    key_templates: ["Rule:{p.def.name}", "Rule:*"]
    guard_probes:
      - name: sha_matches_def
        cypher: "WITH 1 AS ok WHERE $p.def.name <> 'Genesis' AND CASE WHEN $p.def_json IS NULL THEN false ELSE Kernel.sha256($p.def_json) = $p.sha END RETURN ok"
      - name: sha_new
        cypher: "OPTIONAL MATCH (same:Rule {sha: $p.sha}) WITH count(same) AS n WHERE n = 0 RETURN n"
      - name: version_next
        cypher: "OPTIONAL MATCH (v:Rule {name: $p.def.name}) WITH coalesce(max(v.version), 0) AS top WHERE $p.def.version = top + 1 RETURN top"
    body_file: core/register_rule.cypher

  - name: DeactivateRule
    version: 1
    class: meta
    layer: core
    caller: [operator]
    prelude: P0
    reads: [Rule]
    writes: [Rule.active]
    key_templates: ["Rule:{p.name}", "Rule:*"]
    guard_probes:
      - name: active_and_not_kernel
        cypher: "MATCH (x:Rule {name: $p.name, version: $p.version}) WHERE x.active = true AND x.class <> 'kernel' AND NOT x.name IN ['RegisterRule', 'DeactivateRule', 'RegisterAgent'] RETURN x.sha"
    body_file: core/deactivate_rule.cypher

  - name: RegisterAgent
    version: 1
    class: meta
    layer: core
    caller: [operator]
    prelude: P0
    reads: [Agent, Skill]
    writes: [Agent, HAS_SKILL, Agent.active]
    key_templates: ["Agent:*", "Agent:{p.id}:state"]
    guard_probes:
      - name: op_valid
        cypher: "OPTIONAL MATCH (ex:Agent {id: $p.id}) OPTIONAL MATCH (sk:Skill) WHERE sk.id IN $p.skills WITH ex, collect(DISTINCT sk) AS sks WHERE ($p.op = 'register' AND ex IS NULL AND $p.role IN $ROLES AND $p.role <> 'kernel' AND size(sks) = size($p.skills)) OR ($p.op = 'deactivate' AND ex IS NOT NULL AND ex.active = true AND ex.role <> 'kernel') RETURN size(sks)"
    body_file: core/register_agent.cypher

  # RegisterEntity.Deploy needs its Service, so it has a dedicated body (§9.16).
  - name: RegisterEntity.Deploy
    version: 1
    class: meta
    layer: core
    family: RegisterEntity
    caller: [operator, ingest]
    prelude: P0
    reads: [Service, Entity.uid]
    writes: [Deploy]
    key_templates: ["Deploy:*", "Deploy:{p.id}:state"]
    guard_probes:
      - name: service_exists
        cypher: "MATCH (s:Service {id: $p.service}) RETURN s.id"
      - name: new_uid
        cypher: "OPTIONAL MATCH (ex:Entity {uid: 'dep:' + $p.id}) WITH count(ex) AS n WHERE n = 0 AND $p.id IS NOT NULL RETURN n"
      - name: valid
        cypher: "WITH 1 AS ok WHERE $p.expected_health IN ['ok', 'degraded', 'down'] AND $p.verified IN [true, false] RETURN ok"
    body: |
      // ── BODY · RegisterEntity.Deploy@1 ──────────────────────────────────────────
      MATCH (s:Service {id: $p.service})
      OPTIONAL MATCH (ex:Entity {uid: 'dep:' + $p.id})
      WITH KCTX, s, count(ex) AS n
      WHERE n = 0 AND $p.id IS NOT NULL AND $p.expected_health IN ['ok', 'degraded', 'down']
        AND $p.verified IN [true, false]
      CREATE (:Deploy:Entity {uid: 'dep:' + $p.id, id: $p.id, service: s.id, version: $p.version,
              verified: $p.verified, expected_health: $p.expected_health, rw: $pid})
      WITH KCTX

families:
  # §9.3 R2. Shapes: FP functional+projected, F functional, SP set+projected, S set.
  - family: AssertFact
    template: families/assert_fact.cypher.tmpl
    member_placeholder: <REL>
    defaults:
      version: 1
      class: memory
      layer: core
      caller: [operator, ingest, investigator]
      prelude: P0
      reads: ["<REL>", Entity.uid]
      writes: ["<REL>"]
      key_templates: ["<REL>:{p.s}:*", "<REL>:*:{p.o}", "<REL>:*", "<REL>:*:{p.old_o}"]
    substitutions: {<EXTRA>: "", <ATTRS>: "", <PROJ>: ""}
    guard_probes:
      functional: &functional_probes
        - name: entities_exist_and_typed
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) WHERE <SPRED> AND <OPRED> RETURN s.uid"
        - name: vf_not_future
          cypher: "MATCH (h:Head) WITH <NOW> AS now WHERE $p.vf <= now RETURN now"
        - name: extra
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) WHERE true <EXTRA> RETURN s.uid"
        - name: cardinality_ok
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) OPTIONAL MATCH (s)-[cur:<REL>]->(oo:Entity) WHERE cur.te = $INF AND cur.vt = $INF WITH s, o, count(cur) AS n, head(collect(cur)) AS old, head(collect(oo)) AS old_o OPTIONAL MATCH (s)-[cl:<REL>]->(:Entity) WHERE cl.te = $INF AND cl.vt <> $INF AND cl.vt > $p.vf WITH s, o, n, old, old_o, count(cl) AS overlaps WHERE overlaps = 0 AND ((n = 0 AND $p.supersede = false) OR ($p.supersede = true AND n = 1 AND old.vf < $p.vf AND old_o <> o AND old_o.uid = $p.old_o)) RETURN n"
      set: &set_probes
        - name: entities_exist_and_typed
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) WHERE <SPRED> AND <OPRED> RETURN s.uid"
        - name: vf_not_future
          cypher: "MATCH (h:Head) WITH <NOW> AS now WHERE $p.vf <= now RETURN now"
        - name: extra
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) WHERE s <> o <EXTRA> RETURN s.uid"
        - name: cardinality_ok
          cypher: "MATCH (s:Entity {uid: $p.s}), (o:Entity {uid: $p.o}) OPTIONAL MATCH (s)-[cur:<REL>]->(o) WHERE cur.te = $INF AND (cur.vt = $INF OR cur.vt > $p.vf) WITH count(cur) AS n WHERE n = 0 RETURN n"
    members:
      - member: OWNED_BY
        section: FP
        probes: functional
        substitutions: {<SPRED>: "s:Service", <OPRED>: "o:Team", <PROJ>: OWNER_NOW}
        writes: [OWNED_BY, OWNER_NOW]
      - member: DEPENDS_ON
        section: SP
        probes: set
        substitutions: {<SPRED>: "s:Service", <OPRED>: "(o:Service OR o:ExternalService)", <PROJ>: DEP_NOW,
                        <EXTRA>: "AND $p.hard IN [true, false]", <ATTRS>: ", hard: $p.hard"}
        writes: [DEPENDS_ON, DEP_NOW]
      - member: DEPLOYED
        section: F
        probes: functional
        substitutions: {<SPRED>: "s:Service", <OPRED>: "o:Deploy", <EXTRA>: "AND o.service = s.id"}
      - member: REPLICA_OF
        section: F
        probes: functional
        substitutions: {<SPRED>: "s:Service", <OPRED>: "o:Service", <EXTRA>: "AND s <> o"}
      - member: MEMBER_OF
        section: S
        probes: set
        substitutions: {<SPRED>: "s:Agent", <OPRED>: "o:Team"}

  # §9.4 R3. Variants: PROJECTED (the projection edge of the retracted version is deleted) and PLAIN.
  - family: RetractFact
    template: families/retract_fact.cypher.tmpl
    member_placeholder: <REL>
    defaults:
      version: 1
      class: memory
      layer: core
      caller: [operator, ingest, investigator]
      prelude: P0
      reads: ["<REL>", Entity.uid]
      writes: ["<REL>"]
      key_templates: ["<REL>:{p.s}:*", "<REL>:*:{p.o}", "<REL>:*"]
    substitutions: {<ATTR_COPY>: "", <PROJ>: ""}
    guard_probes:
      all:
        - name: version_current
          cypher: "MATCH (s:Entity {uid: $p.s})-[cur:<REL> {fid: $p.fid}]->(o:Entity) WHERE cur.te = $INF AND o.uid = $p.o RETURN cur.fid"
        - name: mode_valid
          cypher: "MATCH (h:Head) MATCH (s:Entity {uid: $p.s})-[cur:<REL> {fid: $p.fid}]->(o:Entity) WITH cur, <NOW> AS now WHERE $p.mode = 'void' OR ($p.mode = 'end' AND cur.vt = $INF AND cur.vf < $p.vt_end AND $p.vt_end <= now) RETURN cur.fid"
    members:
      - {member: OWNED_BY, section: PROJECTED, probes: all, substitutions: {<PROJ>: OWNER_NOW}, writes: [OWNED_BY, OWNER_NOW]}
      - {member: DEPENDS_ON, section: PROJECTED, probes: all, substitutions: {<PROJ>: DEP_NOW, <ATTR_COPY>: ", hard: cur.hard"}, writes: [DEPENDS_ON, DEP_NOW]}
      - {member: DEPLOYED, section: PLAIN, probes: all}
      - {member: REPLICA_OF, section: PLAIN, probes: all}
      - {member: MEMBER_OF, section: PLAIN, probes: all}
      - {member: ROOT_CAUSE, section: PLAIN, probes: all, substitutions: {<ATTR_COPY>: ", by: cur.by, confidence: cur.confidence"}}

  # §9.16 M7 (Deploy has its own body under `rules`).
  - family: RegisterEntity
    template: families/register_entity.cypher.tmpl
    member_placeholder: <Label>
    defaults:
      version: 1
      class: meta
      layer: core
      caller: [operator, ingest]
      prelude: P0
      reads: [Entity.uid]
      writes: ["<Label>"]
      key_templates: ["<Label>:*", "<Label>:{p.id}:state"]
    substitutions: {<VALID>: "", <PROPS>: ""}
    guard_probes:
      all:
        - name: new_uid
          cypher: "OPTIONAL MATCH (ex:Entity {uid: '<KIND>:' + $p.id}) WITH count(ex) AS n WHERE n = 0 AND $p.id IS NOT NULL RETURN n"
        - name: valid
          cypher: "WITH 1 AS ok WHERE true <VALID> RETURN ok"
    members:
      - member: Service
        probes: all
        substitutions:
          <KIND>: svc
          <VALID>: "AND $p.criticality >= 1 AND $p.criticality <= 5 AND $p.user_facing IN [true, false]"
          <PROPS>: ", name: $p.name, tier: $p.tier, criticality: $p.criticality, user_facing: $p.user_facing, health: 'ok', mode: 'normal'"
      - member: Team
        probes: all
        substitutions: {<KIND>: team, <PROPS>: ", name: $p.name"}
      - member: Skill
        probes: all
        substitutions: {<KIND>: skill}
      - member: ExternalService
        layer: T-D
        probes: all
        substitutions:
          <KIND>: ext
          <VALID>: "AND $p.contract_criticality >= 1 AND $p.contract_criticality <= 5"
          <PROPS>: ", tenant: $p.tenant, remote_id: $p.remote_id, contract_criticality: $p.contract_criticality, health: 'ok', remote_mode: 'normal'"
